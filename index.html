  <style>
    * {

      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    #app {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    /* 側邊控制欄 */
    #sidebar {
      width: 360px;
      background-color: #ffffff;
      box-shadow: 2px 0 10px rgba(0,0,0,0.1);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .header {
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 1.3rem;
      color: #1a202c;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 0.85rem;
      color: #718096;
    }

    .filter-group {
      margin-bottom: 15px;
    }

    .filter-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 6px;
    }

    .filter-group select, .filter-group input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .filter-group select:focus, .filter-group input:focus {
      border-color: #3182ce;
    }

    .btn-reset {
      width: 100%;
      padding: 9px;
      background-color: #3182ce;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 5px;
    }

    .btn-reset:hover {
      background-color: #2b6cb0;
    }

    .stats {
      margin-top: 15px;
      padding: 10px;
      background-color: #edf2f7;
      border-radius: 6px;
      font-size: 0.85rem;
      color: #2d3748;
      text-align: center;
    }

    /* 地圖區域 */
    #map {
      flex: 1;
      height: 100%;
    }

    /* Popup 樣式優化 */
    .popup-card {
      padding: 5px;
    }

    .popup-card h3 {
      font-size: 1.05rem;
      color: #2b6cb0;
      margin-bottom: 8px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 4px;
    }

    .popup-info {
      font-size: 0.88rem;
      line-height: 1.6;
      color: #2d3748;
    }

    .popup-tag {
      display: inline-block;
      padding: 2px 8px;
      background-color: #feebc8;
      color: #9b2c2c;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: bold;
      margin-top: 6px;
    }

    /* 響應式手機佈局 */
    @media (max-width: 768px) {
      #app {
        flex-direction: column;
      }
      #sidebar {
        width: 100%;
        height: auto;
        max-height: 40vh;
        overflow-y: auto;
        padding: 15px;
      }
      #map {
        flex: 1;
      }
    }
  </style>
</head>

<div id="app">

    <div class="filter-group">

</div>

  // 全域變數
  let map, markersGroup;

  // 初始化地圖
  function initMap() {
    // 高雄市中心點 (約在三民/苓雅區一帶)
    map = L.map('map').setView([22.6273, 120.3014], 11);

    // 載入 OpenStreetMap 圖層
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> 貢獻者',
      maxZoom: 19
    }).addTo(map);

    // 初始化 Marker Cluster
    markersGroup = L.markerClusterGroup({
      chunkedLoading: true,
      maxClusterRadius: 50
    });
    map.addLayer(markersGroup);

    // 初始化選單與資料
    populateFilterOptions();
    renderMarkers(cameraData);

    // 事件監聽
    document.getElementById('districtSelect').addEventListener('change', filterData);
    document.getElementById('itemSelect').addEventListener('change', filterData);
    document.getElementById('searchInput').addEventListener('input', filterData);
  }

  // 自動動態填入行政區與取締項目下拉選單
  function populateFilterOptions() {
    const districts = [...new Set(cameraData.map(d => d.district))].sort();
    const items = [...new Set(cameraData.map(d => d.item))].sort();

    const districtSelect = document.getElementById('districtSelect');
    districts.forEach(d => {
      const opt = document.createElement('option');
      opt.value = d;
      opt.textContent = d;
      districtSelect.appendChild(opt);
    });

    const itemSelect = document.getElementById('itemSelect');
    items.forEach(i => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = i;
      itemSelect.appendChild(opt);
    });
  }

  // 繪製地標
  function renderMarkers(data) {
    markersGroup.clearLayers();

    data.forEach(item => {
      const marker = L.marker([item.lat, item.lng]);

      const popupContent = `
        <div class="popup-card">
          <h3>#${item.id} ${item.location}</h3>
          <div class="popup-info">
            <b>行政區：</b>${item.district}<br>
            <b>測照方向：</b>${item.direction}<br>
            <b>取締項目：</b>${item.item}
          </div>
          <span class="popup-tag">移動式測速照相</span>
        </div>
      `;

      marker.bindPopup(popupContent);
      markersGroup.addLayer(marker);
    });

    // 更新統計數據
    document.getElementById('statsInfo').textContent = `共計 ${data.length} 筆照相地點`;
  }

  // 複合條件篩選機制
  function filterData() {
    const selectedDistrict = document.getElementById('districtSelect').value;
    const selectedItem = document.getElementById('itemSelect').value;
    const searchText = document.getElementById('searchInput').value.trim().toLowerCase();

    const filtered = cameraData.filter(d => {
      const matchDistrict = selectedDistrict === "" || d.district === selectedDistrict;
      const matchItem = selectedItem === "" || d.item === selectedItem;
      const matchSearch = searchText === "" || d.location.toLowerCase().includes(searchText);
      return matchDistrict && matchItem && matchSearch;
    });

    renderMarkers(filtered);
  }

  // 重設篩選
  function resetFilters() {
    document.getElementById('districtSelect').value = "";
    document.getElementById('itemSelect').value = "";
    document.getElementById('searchInput').value = "";
    renderMarkers(cameraData);
    map.setView([22.6273, 120.3014], 11);
  }

  // 當 DOM 載入完畢後啟動
  document.addEventListener('DOMContentLoaded', initMap);
</script>
